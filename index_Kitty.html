<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mange-Mur Simulator - Hello Kitty Edition</title>
    
    <!-- Importation d'une police mignonne et arrondie -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding-top: 5px;
            /* Fond rose pastel */
            background-color: #ffe6f2; 
            color: #d10056; /* Texte rose foncé */
            font-family: 'Fredoka', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            overflow: hidden; 
            touch-action: none; 
            box-sizing: border-box;
        }

        #authorCredits {
            font-size: 14px;
            color: #ff4d94;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        #gameTitle {
            font-size: clamp(20px, 7vw, 36px); 
            white-space: nowrap; 
            margin: 0 0 10px 0;
            color: #ff1493;
            /* Ombre blanche pour faire ressortir le texte mignon */
            text-shadow: 2px 2px 0px #ffffff, -1px -1px 0px #ffffff, 1px -1px 0px #ffffff, -1px 1px 0px #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #scoreboard {
            display: flex;
            gap: 30px;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ff4d94;
            background: #ffffff;
            padding: 5px 20px;
            border-radius: 20px;
            border: 2px solid #ffb3d9;
            box-shadow: 0 4px 0px #ffb3d9;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 95vw;
            max-height: calc(100vh - 140px);
            /* NOUVELLE PROPORTION : 1080 par 1440 (-5 cases en bas) */
            aspect-ratio: 1080 / 1440; 
            margin: 0 auto; 
        }

        canvas {
            /* Fond blanc pour la grille */
            background-color: #ffffff; 
            border: 4px solid #ff99c2;
            border-radius: 15px;
            box-shadow: 0 8px 0px #ffb3d9; /* Effet de profondeur mignon */
            width: 100%; 
            height: 100%; 
            display: block;
            object-fit: contain; 
        }

        .overlayScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 230, 242, 0.9); /* Fond rose transparent */
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            color: #d10056;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        #startScreen { z-index: 10; }
        
        #gameOverScreen {
            display: none;
            z-index: 5;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1.cheh-title {
            font-size: 42px;
            margin: 0;
            color: #ff0000;
            text-shadow: 3px 3px 0px #ffffff, 6px 6px 0px #ffb3d9;
            letter-spacing: 4px;
        }

        .overlayScreen p.score-text {
            font-size: 20px;
            font-weight: 600;
            margin: 10px 0;
            background: #fff;
            padding: 5px 15px;
            border-radius: 15px;
            border: 2px dashed #ff99c2;
        }

        #leaderboardContainer {
            background: #ffffff;
            border: 3px dashed #ff99c2;
            border-radius: 15px;
            padding: 8px 15px;
            margin: 10px 0;
            box-shadow: 0 4px 0px #ffe6f2;
            width: 85%;
            max-width: 280px;
            max-height: 200px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #leaderboardContainer h3 {
            margin: 0 0 6px 0;
            color: #ff4d94;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px; 
            text-align: left;
            font-weight: 600;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px solid #ffe6f2;
            padding-bottom: 3px;
        }

        .leaderboard-entry .rank { color: #ff99c2; width: 25px;}
        .leaderboard-entry .name { color: #d10056; max-width: 120px; overflow: hidden;}
        .leaderboard-entry .score { color: #ff0055; }

        button {
            margin-top: 10px;
            padding: 12px 0;
            width: 80%;
            max-width: 240px;
            font-size: 16px;
            background-color: #ff99c2;
            color: #ffffff;
            border: 3px solid #ff4d94;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0px #ff4d94;
            transition: all 0.1s;
            font-weight: 600;
            text-transform: uppercase;
            font-family: inherit;
            user-select: none;
            -webkit-user-select: none;
        }

        button:hover, button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0px #ff4d94;
            background-color: #ffb3d9;
        }

        @media (max-width: 400px) {
            #authorCredits { font-size: 12px; }
            #scoreboard { font-size: 18px; gap: 20px; }
            h1.cheh-title { font-size: 36px; }
            .overlayScreen p.score-text { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="authorCredits">🎀 By Louane 2026 🎀</div>

    <h1 id="gameTitle">Mange-Mur Simulator</h1>

    <div id="scoreboard">
        <div id="scoreDisplay">Score: 0</div>
        <div id="highScoreDisplay">Top 1: 0</div>
    </div>
    
    <div id="gameContainer">
        <!-- Hauteur réduite à 1440 (-5 cases de 40px) -->
        <canvas id="gameCanvas" width="1080" height="1440"></canvas>
        
        <div id="startScreen" class="overlayScreen">
            <h2 style="color: #ff1493; font-size: 26px;">Prêt à jouer ? 🌸</h2>
            <button onclick="startGame()">Démarrer</button>
        </div>

        <div id="gameOverScreen" class="overlayScreen">
            <h1 class="cheh-title">CHEH !</h1>
            <p class="score-text">Score final : <span id="finalScore" style="color:#ff0055;">0</span></p>
            
            <div id="leaderboardContainer">
                <h3>Classement Top 10</h3>
                <ul id="leaderboardList" class="leaderboard-list">
                    <li>Chargement...</li>
                </ul>
            </div>

            <button onclick="chargerClassement()">Actualiser</button>
            <button onclick="resetGame()">Rejouer</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let vitesseJeu = 170; 
        let score = 0;
        let top10 = [];

        async function chargerClassement() {
            try {
                const reponse = await fetch('/api');
                const data = await reponse.json();
                if (Array.isArray(data)) {
                    top10 = data;
                    updateHighScoreDisplay();
                    renderLeaderboard();
                }
            } catch (e) {
                console.error("Erreur de chargement du classement :", e);
            }
        }

        async function envoyerScore(nom, scoreFinal) {
            try {
                const reponse = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nom, score: scoreFinal })
                });
                const data = await reponse.json();
                if (Array.isArray(data)) {
                    top10 = data;
                    updateHighScoreDisplay();
                    renderLeaderboard();
                }
            } catch (e) {
                console.error("Erreur d'envoi du score :", e);
            }
        }

        chargerClassement();

        let gridSize = 40; 
        let dx = gridSize;
        let dy = 0;
        let snake = [];
        let foodX;
        let foodY;
        let isGameOverState = false;
        let gameLoopTimeout;
        let gameStarted = false;
        let particles = [];

        let audioCtx;
        let bgmInterval;
        let currentNoteIndex = 0;
        const melody = [440, 493.88, 523.25, 659.25, 523.25, 493.88];

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, now);
                osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1); 
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'die') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.4); 
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        function playBGMNote() {
            if (!audioCtx || isGameOverState) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            osc.type = 'sine'; 
            osc.frequency.value = melody[currentNoteIndex];
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.03, now + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3); 
            
            osc.start(now);
            osc.stop(now + 0.35);
            
            currentNoteIndex = (currentNoteIndex + 1) % melody.length;
        }

        function startBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
            currentNoteIndex = 0;
            bgmInterval = setInterval(playBGMNote, 400);
        }

        function stopBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = "none";
            initAudio();
            gameStarted = true;
            initGame();
        }

        function initGame() {
            score = 0;
            dx = gridSize;
            dy = 0;
            isGameOverState = false;
            particles = [];
            document.getElementById('scoreDisplay').innerHTML = "Score: " + score;
            document.getElementById('gameOverScreen').style.display = "none";
            
            snake = [];
            // Centrage ajusté pour la nouvelle hauteur de 1440 (Position Y: 720)
            for(let i=0; i<6; i++){ 
                snake.push({x: 520 - (i*gridSize), y: 720});
            }

            generateFood();
            startBGM(); 
            main();
        }

        function main() {
            if (hasGameEnded()) {
                showGameOver();
                return;
            }
            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawGrid();
                updateParticles();
                drawParticles();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, vitesseJeu); 
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawGrid() {
            ctx.strokeStyle = "rgba(255, 153, 194, 0.2)"; 
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        function createExplosion(x, y) {
            const cuteColors = ['#ff99c2', '#ff4d94', '#ff0000', '#ffcc00'];
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 5;
                particles.push({
                    x: x + gridSize / 2, y: y + gridSize / 2,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    color: cuteColors[Math.floor(Math.random() * cuteColors.length)],
                    alpha: 1, life: Math.random() * 15 + 15
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.92; p.vy *= 0.92;
                p.alpha -= 1 / p.life;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha; 
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawSnake() {
            for(let i = snake.length - 1; i >= 0; i--) drawSnakePart(snake[i], i);
        }

        function drawSnakePart(snakePart, index) {
            if (index !== 0) {
                ctx.fillStyle = index % 2 === 0 ? "#ffffff" : "#ffe6f2";
                ctx.beginPath();
                ctx.roundRect(snakePart.x + 3, snakePart.y + 3, gridSize - 6, gridSize - 6, 12);
                ctx.fill();
                ctx.strokeStyle = "#ff99c2";
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(snakePart.x + 1, snakePart.y + 1, gridSize - 2, gridSize - 2, 16);
                ctx.fill();
                ctx.strokeStyle = "#ff99c2";
                ctx.lineWidth = 2;
                ctx.stroke();

                let eye1 = {x: 0, y: 0}, eye2 = {x: 0, y: 0}, nose = {x: 0, y: 0}, bow = {x: 0, y: 0};
                
                if(dx === gridSize) { 
                    eye1 = {x: 24, y: 12}; eye2 = {x: 24, y: 28};
                    nose = {x: 32, y: 20}; bow = {x: 10, y: 8};
                } else if(dx === -gridSize) { 
                    eye1 = {x: 16, y: 12}; eye2 = {x: 16, y: 28};
                    nose = {x: 8, y: 20}; bow = {x: 30, y: 8};
                } else if(dy === -gridSize) { 
                    eye1 = {x: 12, y: 16}; eye2 = {x: 28, y: 16};
                    nose = {x: 20, y: 8}; bow = {x: 30, y: 30};
                } else if(dy === gridSize) { 
                    eye1 = {x: 12, y: 24}; eye2 = {x: 28, y: 24};
                    nose = {x: 20, y: 32}; bow = {x: 30, y: 10};
                }

                ctx.fillStyle = "#000000"; 
                ctx.beginPath(); ctx.ellipse(snakePart.x + eye1.x, snakePart.y + eye1.y, 2, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(snakePart.x + eye2.x, snakePart.y + eye2.y, 2, 4, 0, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = "#ffcc00"; 
                ctx.beginPath(); ctx.ellipse(snakePart.x + nose.x, snakePart.y + nose.y, 3, 2, 0, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = "#ff0000";
                ctx.beginPath();
                ctx.arc(snakePart.x + bow.x - 5, snakePart.y + bow.y - 4, 5, 0, Math.PI*2);
                ctx.arc(snakePart.x + bow.x + 5, snakePart.y + bow.y - 4, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(snakePart.x + bow.x, snakePart.y + bow.y - 2, 4, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head); 
            if (snake[0].x === foodX && snake[0].y === foodY) {
                score += 10;
                document.getElementById('scoreDisplay').innerHTML = "Score: " + score;
                playSound('eat'); 
                createExplosion(foodX, foodY); 
                generateFood();
            } else {
                snake.pop(); 
            }
        }

        function drawFood() {
            const cx = foodX + gridSize / 2, cy = foodY + gridSize / 2;
            
            ctx.fillStyle = "#ff0000"; 
            ctx.beginPath();
            ctx.arc(cx - 4, cy, 12, 0, Math.PI * 2);
            ctx.arc(cx + 4, cy, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#33cc33";
            ctx.beginPath();
            ctx.ellipse(cx + 6, cy - 12, 6, 3, Math.PI/4, 0, Math.PI*2);
            ctx.fill();
        }

        function randomTen(min, max) { return Math.round((Math.random() * (max - min) + min) / gridSize) * gridSize; }
        
        function generateFood() {
            foodX = randomTen(0, canvas.width - gridSize); foodY = randomTen(0, canvas.height - gridSize);
            snake.forEach(part => { if (part.x == foodX && part.y == foodY) generateFood(); });
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
        }

        function showGameOver() {
            isGameOverState = true;
            stopBGM(); 
            playSound('die'); 
            
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverScreen").style.display = "flex";
            
            chargerClassement();

            setTimeout(() => {
                if (score > 0) {
                    let playerName = prompt("FIN DE PARTIE ! 🌸\nEntrez votre pseudo (maximum 10 caractères) :", "JOUEUR");
                    if (playerName && playerName.trim() !== "") {
                        playerName = playerName.trim().substring(0, 10);
                        envoyerScore(playerName, score);
                    }
                }
            }, 300);
        }

        function updateHighScoreDisplay() {
            let highest = top10.length > 0 ? top10[0].score : 0;
            document.getElementById("highScoreDisplay").innerHTML = "Top 1: " + highest;
        }

        function renderLeaderboard() {
            const listElement = document.getElementById("leaderboardList");
            listElement.innerHTML = ""; 

            if (top10.length === 0) {
                listElement.innerHTML = "<li style='text-align:center; color:#ff99c2;'>Aucun score enregistré</li>";
                return;
            }

            top10.forEach((entry, index) => {
                const li = document.createElement("li");
                li.className = "leaderboard-entry";
                li.innerHTML = `
                    <span class="rank">#${index + 1}</span>
                    <span class="name">${entry.name}</span>
                    <span class="score">${entry.score}</span>
                `;
                listElement.appendChild(li);
            });
        }

        function resetGame() {
            clearTimeout(gameLoopTimeout);
            initGame();
        }

        // --- CONTRÔLES ---
        document.addEventListener("keydown", function(event) {
            if (!gameStarted && event.key === "Enter") { startGame(); return; }
            if (event.key === "Enter" && isGameOverState) { resetGame(); return; }
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(event.key) > -1) event.preventDefault();
            handleDirection(event.keyCode);
        });

        let touchStartX = 0, touchStartY = 0;
        
        document.addEventListener('touchstart', function(event) {
            if (!gameStarted || isGameOverState) return;
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchmove', function(event) {
            if(gameStarted && !isGameOverState) event.preventDefault();
        }, {passive: false});

        document.addEventListener('touchend', function(event) {
            if (!gameStarted || isGameOverState) return;
            handleSwipe(touchStartX, touchStartY, event.changedTouches[0].screenX, event.changedTouches[0].screenY);
        }, {passive: false});

        function handleSwipe(startX, startY, endX, endY) {
            let diffX = endX - startX, diffY = endY - startY;
            if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) handleDirection(39); else handleDirection(37);
            } else {
                if (diffY > 0) handleDirection(40); else handleDirection(38);
            }
        }

        function handleDirection(keyCode) {
            const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
            const goingUp = dy === -gridSize, goingDown = dy === gridSize, goingRight = dx === gridSize, goingLeft = dx === -gridSize;
            if (keyCode === LEFT_KEY && !goingRight) { dx = -gridSize; dy = 0; }
            if (keyCode === UP_KEY && !goingDown) { dx = 0; dy = -gridSize; }
            if (keyCode === RIGHT_KEY && !goingLeft) { dx = gridSize; dy = 0; }
            if (keyCode === DOWN_KEY && !goingUp) { dx = 0; dy = gridSize; }
        }
        
        clearCanvas();
        drawGrid();

    </script>
</body>
</html>
