<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mange-Mur Simulator - Galaxy Edition</title>
    
    <!-- Importation d'une police futuriste / sci-fi -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding-top: 5px;
            /* Fond Nébuleuse Sombre */
            background: radial-gradient(ellipse at bottom, #1b0033 0%, #050011 100%);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden; 
            touch-action: none; 
            box-sizing: border-box;
        }

        /* Étoiles en arrière-plan */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.4;
            z-index: -1;
        }

        #authorCredits {
            font-size: 14px;
            color: #b026ff;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 0 10px #b026ff;
        }

        #gameTitle {
            font-size: clamp(20px, 6vw, 36px); 
            white-space: nowrap; 
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #b026ff, 0 0 80px #b026ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            font-weight: 900;
        }

        #scoreboard {
            display: flex;
            gap: 40px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #00ffff;
            background: rgba(11, 3, 32, 0.6);
            padding: 8px 25px;
            border-radius: 8px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2);
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 95vw;
            max-height: calc(100vh - 140px);
            /* Proportions 1080 par 1440 */
            aspect-ratio: 1080 / 1440; 
            margin: 0 auto; 
        }

        canvas {
            /* Ciel profond du jeu */
            background-color: rgba(5, 2, 15, 0.85); 
            border: 2px solid #b026ff;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(176, 38, 255, 0.4), inset 0 0 30px rgba(0, 255, 255, 0.1); 
            width: 100%; 
            height: 100%; 
            display: block;
            object-fit: contain; 
        }

        .overlayScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 0, 20, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #00ffff;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        #startScreen { z-index: 10; }
        
        #gameOverScreen {
            display: none;
            z-index: 5;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1.cheh-title {
            font-size: 50px;
            margin: 0;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            letter-spacing: 6px;
            font-weight: 900;
        }

        .overlayScreen p.score-text {
            font-size: 18px;
            font-weight: 700;
            margin: 10px 0;
            color: #ffffff;
            text-shadow: 0 0 10px #b026ff;
        }

        #leaderboardContainer {
            background: rgba(0, 0, 10, 0.8);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 10px 15px;
            margin: 15px 0;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            width: 85%;
            max-width: 280px;
            max-height: 200px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #leaderboardContainer h3 {
            margin: 0 0 8px 0;
            color: #b026ff;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #b026ff;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 12px; 
            text-align: left;
            font-weight: 500;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            padding-bottom: 3px;
        }

        .leaderboard-entry .rank { color: #555555; width: 25px;}
        .leaderboard-entry .name { color: #ffffff; max-width: 120px; overflow: hidden; text-shadow: 0 0 5px #00ffff;}
        .leaderboard-entry .score { color: #00ffff; font-weight: 700; }

        button {
            margin-top: 10px;
            padding: 12px 0;
            width: 80%;
            max-width: 240px;
            font-size: 16px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
            transition: all 0.2s;
            font-weight: 700;
            text-transform: uppercase;
            font-family: inherit;
            letter-spacing: 2px;
            user-select: none;
            -webkit-user-select: none;
        }

        button:hover, button:active {
            background-color: #00ffff;
            color: #050011;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }

        @media (max-width: 400px) {
            #authorCredits { font-size: 12px; }
            #scoreboard { font-size: 16px; gap: 20px; }
            h1.cheh-title { font-size: 40px; }
            .overlayScreen p.score-text { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div id="authorCredits">✨ By Louane 2026 ✨</div>

    <h1 id="gameTitle">Mange-Mur Simulator</h1>

    <div id="scoreboard">
        <div id="scoreDisplay">SCORE: 0</div>
        <div id="highScoreDisplay">TOP 1: 0</div>
    </div>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1080" height="1440"></canvas>
        
        <div id="startScreen" class="overlayScreen">
            <h2 style="color: #b026ff; font-size: 26px; text-shadow: 0 0 15px #b026ff;">SYSTÈME PRÊT</h2>
            <button onclick="startGame()">DÉCOLLAGE 🚀</button>
        </div>

        <div id="gameOverScreen" class="overlayScreen">
            <h1 class="cheh-title">CRASH !</h1>
            <p class="score-text">ÉNERGIE RÉCOLTÉE : <span id="finalScore" style="color:#00ffff;">0</span></p>
            
            <div id="leaderboardContainer">
                <h3>CLASSEMENT GALACTIQUE</h3>
                <ul id="leaderboardList" class="leaderboard-list">
                    <li>Connexion...</li>
                </ul>
            </div>

            <button onclick="chargerClassement()">ACTUALISER</button>
            <button onclick="resetGame()">RELANCER</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let vitesseJeu = 170; 
        let score = 0;
        let top10 = [];

        async function chargerClassement() {
            try {
                const reponse = await fetch('/api');
                const data = await reponse.json();
                if (Array.isArray(data)) {
                    top10 = data;
                    updateHighScoreDisplay();
                    renderLeaderboard();
                }
            } catch (e) {
                console.error("Erreur de chargement du classement :", e);
            }
        }

        async function envoyerScore(nom, scoreFinal) {
            try {
                const reponse = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nom, score: scoreFinal })
                });
                const data = await reponse.json();
                if (Array.isArray(data)) {
                    top10 = data;
                    updateHighScoreDisplay();
                    renderLeaderboard();
                }
            } catch (e) {
                console.error("Erreur d'envoi du score :", e);
            }
        }

        chargerClassement();

        let gridSize = 40; 
        let dx = gridSize;
        let dy = 0;
        let snake = [];
        
        let foodX;
        let foodY;
        let currentFoodType = 'saturn'; // Type de la planète actuelle
        const foodTypes = ['saturn', 'sun', 'moon', 'earth', 'mars'];
        
        let isGameOverState = false;
        let gameLoopTimeout;
        let gameStarted = false;
        let particles = [];
        let sparkleTime = 0;

        let audioCtx;
        let bgmInterval;
        let currentNoteIndex = 0;
        const melody = [220, 277.18, 329.63, 440, 329.63, 277.18];

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1); 
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'die') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.5); 
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        function playBGMNote() {
            if (!audioCtx || isGameOverState) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            osc.type = 'triangle'; 
            osc.frequency.value = melody[currentNoteIndex];
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.03, now + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3); 
            
            osc.start(now);
            osc.stop(now + 0.35);
            
            currentNoteIndex = (currentNoteIndex + 1) % melody.length;
        }

        function startBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
            currentNoteIndex = 0;
            bgmInterval = setInterval(playBGMNote, 400);
        }

        function stopBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = "none";
            initAudio();
            gameStarted = true;
            initGame();
        }

        function initGame() {
            score = 0;
            dx = gridSize;
            dy = 0;
            isGameOverState = false;
            particles = [];
            document.getElementById('scoreDisplay').innerHTML = "SCORE: " + score;
            document.getElementById('gameOverScreen').style.display = "none";
            
            snake = [];
            for(let i=0; i<6; i++){ 
                snake.push({x: 520 - (i*gridSize), y: 720});
            }

            generateFood();
            startBGM(); 
            main();
        }

        function main() {
            if (hasGameEnded()) {
                showGameOver();
                return;
            }
            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawGrid();
                updateParticles();
                drawParticles();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, vitesseJeu); 
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawGrid() {
            ctx.strokeStyle = "rgba(0, 255, 255, 0.03)"; 
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        function createExplosion(x, y) {
            const cosmicColors = ['#00ffff', '#b026ff', '#ffffff', '#ff0055'];
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 4;
                particles.push({
                    type: 'star',
                    x: x + gridSize / 2, y: y + gridSize / 2,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    color: cosmicColors[Math.floor(Math.random() * cosmicColors.length)],
                    alpha: 1, life: Math.random() * 20 + 10
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.90; p.vy *= 0.90; 
                p.alpha -= 1 / p.life;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha; 
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.strokeStyle = p.color; 
                ctx.lineWidth = 2; 
                ctx.lineCap = 'round';
                ctx.beginPath(); 
                ctx.moveTo(p.x, p.y); 
                ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2); 
                ctx.stroke(); 
                ctx.restore();
            });
        }

        function drawSnake() {
            for(let i = snake.length - 1; i >= 0; i--) drawSnakePart(snake[i], i);
        }

        function drawSnakePart(snakePart, index) {
            const ratio = index / snake.length; 
            
            // Dégradé cosmique du vaisseau vers la queue
            const r = Math.floor(0 + ratio * 100);    
            const g = Math.floor(255 - ratio * 255);  
            const b = Math.floor(255 - ratio * 100);  
            const color = `rgb(${r}, ${g}, ${b})`;

            if (index === 0) {
                // --- TÊTE = VAISSEAU SPATIAL ---
                ctx.save();
                // On se place au centre de la case pour dessiner et tourner le vaisseau
                ctx.translate(snakePart.x + gridSize/2, snakePart.y + gridSize/2);
                
                // Calcul de l'angle de rotation en fonction de la direction
                let angle = 0;
                if (dx === gridSize) angle = Math.PI / 2; // Droite
                else if (dx === -gridSize) angle = -Math.PI / 2; // Gauche
                else if (dy === gridSize) angle = Math.PI; // Bas
                // Le Haut est 0 par défaut
                ctx.rotate(angle);

                // 1. Réacteur (Flamme qui bouge)
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff0055";
                ctx.fillStyle = "#ff0055";
                ctx.beginPath();
                ctx.moveTo(-6, 12);
                ctx.lineTo(0, 22 + Math.random() * 8); // Flamme aléatoire
                ctx.lineTo(6, 12);
                ctx.closePath();
                ctx.fill();

                // 2. Coque du Vaisseau (Métal clair)
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00ffff";
                ctx.fillStyle = "#e0e6ed";
                ctx.beginPath();
                ctx.moveTo(0, -18);   // Pointe avant
                ctx.lineTo(14, 12);   // Aile Droite
                ctx.lineTo(0, 6);     // Base arrière centrée
                ctx.lineTo(-14, 12);  // Aile Gauche
                ctx.closePath();
                ctx.fill();
                
                // Lignes de séparation / Ailes
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 1;
                ctx.stroke();

                // 3. Cockpit (Verre cyan)
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#00ffff";
                ctx.beginPath();
                ctx.ellipse(0, -3, 3.5, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            } else {
                // --- CORPS = TRAÎNÉE D'ÉNERGIE COMÉTAIRE ---
                ctx.shadowColor = color;
                ctx.shadowBlur = 15 - (ratio * 10);
                ctx.fillStyle = color;
                
                ctx.beginPath();
                const radius = (gridSize/2 - 4) * (1 - ratio*0.4);
                ctx.arc(snakePart.x + gridSize/2, snakePart.y + gridSize/2, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head); 
            if (snake[0].x === foodX && snake[0].y === foodY) {
                score += 10;
                document.getElementById('scoreDisplay').innerHTML = "SCORE: " + score;
                playSound('eat'); 
                createExplosion(foodX, foodY); 
                generateFood();
            } else {
                snake.pop(); 
            }
        }

        function drawFood() {
            sparkleTime += 0.1;
            const cx = foodX + gridSize / 2;
            const cy = foodY + gridSize / 2;
            
            ctx.save();
            
            // Différents dessins selon le type de planète générée
            switch(currentFoodType) {
                case 'sun':
                    // Soleil lumineux et pulsant
                    ctx.shadowColor = "#ff5500";
                    ctx.shadowBlur = 25 + Math.sin(sparkleTime) * 15;
                    ctx.fillStyle = "#ffcc00";
                    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill();
                    // Halo
                    ctx.fillStyle = "rgba(255, 150, 0, 0.4)";
                    ctx.beginPath(); ctx.arc(cx, cy, 16 + Math.sin(sparkleTime)*2, 0, Math.PI * 2); ctx.fill();
                    break;
                    
                case 'earth':
                    // Planète bleue/verte
                    ctx.shadowColor = "#0088ff";
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = "#0066ff"; // Océan
                    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#22cc44"; // Terres
                    ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 4, cy + 4, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 6, cy - 2, 3, 0, Math.PI * 2); ctx.fill();
                    break;

                case 'moon':
                    // Lune grise avec cratères
                    ctx.shadowColor = "#ffffff";
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = "#dddddd";
                    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#999999";
                    ctx.beginPath(); ctx.arc(cx - 3, cy - 2, 2.5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 3, cy + 4, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 4, cy - 3, 1.5, 0, Math.PI * 2); ctx.fill();
                    break;

                case 'mars':
                    // Mars rouge/orangée
                    ctx.shadowColor = "#ff2200";
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = "#ff4422";
                    ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#cc2200";
                    ctx.beginPath(); ctx.arc(cx - 2, cy + 3, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 4, cy - 4, 2.5, 0, Math.PI * 2); ctx.fill();
                    break;

                case 'saturn':
                default:
                    // Planète aux anneaux d'origine
                    ctx.shadowColor = "#ffcc00";
                    ctx.shadowBlur = 15 + Math.sin(sparkleTime) * 10;
                    ctx.fillStyle = "#ffaa00";
                    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.shadowBlur = 5;
                    ctx.strokeStyle = "rgba(0, 255, 255, 0.9)";
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 16, 5, Math.PI / 5, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
            }
            
            ctx.restore();
        }

        function randomTen(min, max) { return Math.round((Math.random() * (max - min) + min) / gridSize) * gridSize; }
        
        function generateFood() {
            // Choix aléatoire d'une nouvelle planète
            currentFoodType = foodTypes[Math.floor(Math.random() * foodTypes.length)];
            
            foodX = randomTen(0, canvas.width - gridSize); 
            foodY = randomTen(0, canvas.height - gridSize);
            snake.forEach(part => { if (part.x == foodX && part.y == foodY) generateFood(); });
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
        }

        function showGameOver() {
            isGameOverState = true;
            stopBGM(); 
            playSound('die'); 
            
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverScreen").style.display = "flex";
            
            chargerClassement();

            setTimeout(() => {
                if (score > 0) {
                    let playerName = prompt("TRANSMISSION TERMINÉE 🛸\nEntrez vos initiales (max 10 lettres) :", "PILOTE");
                    if (playerName && playerName.trim() !== "") {
                        playerName = playerName.trim().substring(0, 10).toUpperCase();
                        envoyerScore(playerName, score);
                    }
                }
            }, 300);
        }

        function updateHighScoreDisplay() {
            let highest = top10.length > 0 ? top10[0].score : 0;
            document.getElementById("highScoreDisplay").innerHTML = "TOP 1: " + highest;
        }

        function renderLeaderboard() {
            const listElement = document.getElementById("leaderboardList");
            listElement.innerHTML = ""; 

            if (top10.length === 0) {
                listElement.innerHTML = "<li style='text-align:center; color:#555;'>Données introuvables</li>";
                return;
            }

            top10.forEach((entry, index) => {
                const li = document.createElement("li");
                li.className = "leaderboard-entry";
                li.innerHTML = `
                    <span class="rank">#${index + 1}</span>
                    <span class="name">${entry.name}</span>
                    <span class="score">${entry.score}</span>
                `;
                listElement.appendChild(li);
            });
        }

        function resetGame() {
            clearTimeout(gameLoopTimeout);
            initGame();
        }

        // --- CONTRÔLES ---
        document.addEventListener("keydown", function(event) {
            if (!gameStarted && event.key === "Enter") { startGame(); return; }
            if (event.key === "Enter" && isGameOverState) { resetGame(); return; }
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(event.key) > -1) event.preventDefault();
            handleDirection(event.keyCode);
        });

        let touchStartX = 0, touchStartY = 0;
        
        document.addEventListener('touchstart', function(event) {
            if (!gameStarted || isGameOverState) return;
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchmove', function(event) {
            if(gameStarted && !isGameOverState) event.preventDefault();
        }, {passive: false});

        document.addEventListener('touchend', function(event) {
            if (!gameStarted || isGameOverState) return;
            handleSwipe(touchStartX, touchStartY, event.changedTouches[0].screenX, event.changedTouches[0].screenY);
        }, {passive: false});

        function handleSwipe(startX, startY, endX, endY) {
            let diffX = endX - startX, diffY = endY - startY;
            if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) handleDirection(39); else handleDirection(37);
            } else {
                if (diffY > 0) handleDirection(40); else handleDirection(38);
            }
        }

        function handleDirection(keyCode) {
            const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
            const goingUp = dy === -gridSize, goingDown = dy === gridSize, goingRight = dx === gridSize, goingLeft = dx === -gridSize;
            if (keyCode === LEFT_KEY && !goingRight) { dx = -gridSize; dy = 0; }
            if (keyCode === UP_KEY && !goingDown) { dx = 0; dy = -gridSize; }
            if (keyCode === RIGHT_KEY && !goingLeft) { dx = gridSize; dy = 0; }
            if (keyCode === DOWN_KEY && !goingUp) { dx = 0; dy = gridSize; }
        }
        
        clearCanvas();
        drawGrid();

    </script>
</body>
</html>
