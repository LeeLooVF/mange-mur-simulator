<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mange-Mur Simulator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding-top: 10px;
            background-color: #070810; 
            color: #00e5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            touch-action: none; 
            box-sizing: border-box;
        }

        #gameTitle {
            font-size: clamp(18px, 6.5vw, 32px); 
            white-space: nowrap; 
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 30px #ff007f;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #scoreboard {
            display: flex;
            gap: 30px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 95vw;
            max-height: calc(100vh - 140px);
            /* NOUVELLE PROPORTION : 1080 par 1640 (Grille rectangulaire avec des cases carrées) */
            aspect-ratio: 1080 / 1640; 
            margin: 0 auto; 
        }

        canvas {
            background-color: #070810; 
            border: 2px solid #1a2a3a;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 255, 255, 0.05);
            width: 100%; 
            height: 100%; 
            display: block;
            object-fit: contain; 
        }

        .overlayScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 8, 16, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: white;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        #startScreen { z-index: 10; }
        
        #gameOverScreen {
            display: none;
            z-index: 5;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1.cheh-title {
            font-size: 38px;
            margin: 0;
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8), 3px 3px 0px #300020;
            letter-spacing: 4px;
        }

        .overlayScreen p.score-text {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        #leaderboardContainer {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ff007f;
            border-radius: 8px;
            padding: 8px 15px;
            margin: 10px 0;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            width: 85%;
            max-width: 280px;
            max-height: 200px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #leaderboardContainer h3 {
            margin: 0 0 6px 0;
            color: #00e5ff;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 4px #00e5ff;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px; 
            text-align: left;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 3px;
        }

        .leaderboard-entry .rank { color: #888; width: 25px;}
        .leaderboard-entry .name { color: #ffb3d9; font-weight: bold; word-break: break-all; max-width: 120px; }
        .leaderboard-entry .score { color: #00e5ff; font-weight: bold;}

        button {
            margin-top: 8px;
            padding: 10px 0;
            width: 75%;
            max-width: 220px;
            font-size: 14px;
            background: transparent;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3), inset 0 0 5px rgba(0, 229, 255, 0.1);
            transition: all 0.2s;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            -webkit-user-select: none;
        }

        button:hover, button:active {
            background-color: #00e5ff;
            color: #070810;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
        }

        @media (max-width: 400px) {
            #scoreboard { font-size: 18px; gap: 20px; }
            h1.cheh-title { font-size: 32px; }
            .overlayScreen p.score-text { font-size: 16px; }
        }
    </style>
</head>
<body>

    <h1 id="gameTitle">Mange-Mur Simulator</h1>

    <div id="scoreboard">
        <div id="scoreDisplay">Score: 0</div>
        <div id="highScoreDisplay">Top 1: 0</div>
    </div>
    
    <div id="gameContainer">
        <!-- NOUVELLES DIMENSIONS : 1080 par 1640 (+5 lignes en haut, +8 lignes en bas) -->
        <canvas id="gameCanvas" width="1080" height="1640"></canvas>
        
        <div id="startScreen" class="overlayScreen">
            <h2 style="color: #00e5ff; font-size: 24px; text-shadow: 0 0 10px rgba(0,229,255,0.8);">Prêt à jouer ?</h2>
            <button onclick="startGame()">Démarrer</button>
        </div>

        <div id="gameOverScreen" class="overlayScreen">
            <h1 class="cheh-title">CHEH</h1>
            <p class="score-text">Score final : <span id="finalScore" style="color:#00e5ff;">0</span></p>
            
            <div id="leaderboardContainer">
                <h3>Classement Top 10</h3>
                <ul id="leaderboardList" class="leaderboard-list">
                    <li>Chargement...</li>
                </ul>
            </div>

            <button onclick="chargerClassement()">Actualiser</button>
            <button onclick="resetGame()">Rejouer</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let vitesseJeu = 170; 
        let score = 0;
        let top10 = [];

        async function chargerClassement() {
            try {
                const reponse = await fetch('/api');
                const data = await reponse.json();
                if (Array.isArray(data)) {
                    top10 = data;
                    updateHighScoreDisplay();
                    renderLeaderboard();
                }
            } catch (e) {
                console.error("Erreur de chargement du classement :", e);
            }
        }

        async function envoyerScore(nom, scoreFinal) {
            try {
                const reponse = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nom, score: scoreFinal })
                });
                const data = await reponse.json();
                if (Array.isArray(data)) {
                    top10 = data;
                    updateHighScoreDisplay();
                    renderLeaderboard();
                }
            } catch (e) {
                console.error("Erreur d'envoi du score :", e);
            }
        }

        chargerClassement();

        let gridSize = 40; 
        let dx = gridSize;
        let dy = 0;
        let snake = [];
        let foodX;
        let foodY;
        let isGameOverState = false;
        let gameLoopTimeout;
        let gameStarted = false;
        let particles = [];
        let sparkleTime = 0;

        let audioCtx;
        let bgmInterval;
        let currentNoteIndex = 0;
        const melody = [220, 246.94, 261.63, 329.63, 261.63, 246.94];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1); 
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.15);
            } 
            else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5); 
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        function playBGMNote() {
            if (!audioCtx || isGameOverState) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            osc.type = 'triangle';
            osc.frequency.value = melody[currentNoteIndex];
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.02, now + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3); 
            
            osc.start(now);
            osc.stop(now + 0.35);
            
            currentNoteIndex = (currentNoteIndex + 1) % melody.length;
        }

        function startBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
            currentNoteIndex = 0;
            bgmInterval = setInterval(playBGMNote, 400);
        }

        function stopBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = "none";
            initAudio();
            gameStarted = true;
            initGame();
        }

        function initGame() {
            score = 0;
            dx = gridSize;
            dy = 0;
            isGameOverState = false;
            particles = [];
            document.getElementById('scoreDisplay').innerHTML = "Score: " + score;
            document.getElementById('gameOverScreen').style.display = "none";
            
            snake = [];
            // Centrage mis à jour pour la hauteur de 1640 (Position Y autour de 800)
            for(let i=0; i<10; i++){
                snake.push({x: 520 - (i*gridSize), y: 800});
            }

            generateFood();
            startBGM(); 
            main();
        }

        function main() {
            if (hasGameEnded()) {
                showGameOver();
                return;
            }
            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawGrid();
                updateParticles();
                drawParticles();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, vitesseJeu); 
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawGrid() {
            ctx.strokeStyle = "rgba(0, 200, 255, 0.04)"; 
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        function createExplosion(x, y) {
            const fireworkColors = ['#00FFFF', '#FF00FF', '#B026FF', '#00E5FF', '#FF007F'];
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 15 + 8;
                particles.push({
                    type: 'streak', x: x + gridSize / 2, y: y + gridSize / 2,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    color: fireworkColors[Math.floor(Math.random() * fireworkColors.length)],
                    alpha: 1, life: Math.random() * 15 + 15
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.94; p.vy *= 0.94;
                p.alpha -= 1 / p.life;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha; ctx.shadowColor = p.color; ctx.shadowBlur = 10;
                ctx.strokeStyle = p.color; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 1.5, p.y - p.vy * 1.5); 
                ctx.stroke(); ctx.restore();
            });
        }

        function drawSnake() {
            for(let i = snake.length - 1; i >= 0; i--) drawSnakePart(snake[i], i);
        }

        function drawSnakePart(snakePart, index) {
            const ratio = index / snake.length;
            const hue = 190 + (100 * ratio); 
            const lightness = 50 - (48 * ratio); 
            
            ctx.fillStyle = `hsl(${hue}, 100%, ${lightness}%)`;
            if (index < 6) {
                ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                ctx.shadowBlur = 20 - (index * 3);
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.roundRect(snakePart.x + 2, snakePart.y + 2, gridSize - 4, gridSize - 4, 10);
            ctx.fill();

            if(index === 0) {
                ctx.shadowBlur = 0; ctx.fillStyle = "#ffffff"; ctx.beginPath();
                let eyeOffset1 = {x: 0, y: 0}, eyeOffset2 = {x: 0, y: 0}, pupilOffset = {x: 0, y: 0};
                if(dx === gridSize) { eyeOffset1 = {x: 26, y: 12}; eyeOffset2 = {x: 26, y: 28}; pupilOffset = {x: 2, y: 0}; } 
                else if(dx === -gridSize) { eyeOffset1 = {x: 14, y: 12}; eyeOffset2 = {x: 14, y: 28}; pupilOffset = {x: -2, y: 0}; } 
                else if(dy === -gridSize) { eyeOffset1 = {x: 12, y: 14}; eyeOffset2 = {x: 28, y: 14}; pupilOffset = {x: 0, y: -2}; } 
                else if(dy === gridSize) { eyeOffset1 = {x: 12, y: 26}; eyeOffset2 = {x: 28, y: 26}; pupilOffset = {x: 0, y: 2}; }

                ctx.arc(snakePart.x + eyeOffset1.x, snakePart.y + eyeOffset1.y, 4, 0, Math.PI * 2);
                ctx.arc(snakePart.x + eyeOffset2.x, snakePart.y + eyeOffset2.y, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#000000"; ctx.beginPath();
                ctx.arc(snakePart.x + eyeOffset1.x + pupilOffset.x, snakePart.y + eyeOffset1.y + pupilOffset.y, 2, 0, Math.PI * 2);
                ctx.arc(snakePart.x + eyeOffset2.x + pupilOffset.x, snakePart.y + eyeOffset2.y + pupilOffset.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0; 
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head); 
            if (snake[0].x === foodX && snake[0].y === foodY) {
                score += 10;
                document.getElementById('scoreDisplay').innerHTML = "Score: " + score;
                playSound('eat'); 
                createExplosion(foodX, foodY); 
                generateFood();
            } else {
                snake.pop(); 
            }
        }

        function drawFood() {
            sparkleTime += 0.1;
            const cx = foodX + gridSize / 2, cy = foodY + gridSize / 2, radius = (gridSize / 2) - 8;
            ctx.save();
            ctx.shadowColor = "#ff007f"; ctx.shadowBlur = 20 + Math.sin(sparkleTime) * 10;

            const gradient = ctx.createRadialGradient(cx, cy - 4, 0, cx, cy, radius);
            gradient.addColorStop(0, "#ffb3d9"); gradient.addColorStop(0.4, "#ff007f"); gradient.addColorStop(1, "#800040"); 

            ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();

            ctx.shadowBlur = 15; ctx.strokeStyle = "#ff007f"; ctx.lineWidth = 3; ctx.lineCap = "round";
            ctx.beginPath(); ctx.arc(cx, cy + 1, radius + 6, Math.PI + 0.5, Math.PI * 2 - 0.5); ctx.stroke();
            ctx.restore();
        }

        function randomTen(min, max) { return Math.round((Math.random() * (max - min) + min) / gridSize) * gridSize; }
        function generateFood() {
            foodX = randomTen(0, canvas.width - gridSize); foodY = randomTen(0, canvas.height - gridSize);
            snake.forEach(part => { if (part.x == foodX && part.y == foodY) generateFood(); });
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
        }

        function showGameOver() {
            isGameOverState = true;
            stopBGM(); 
            playSound('die'); 
            
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverScreen").style.display = "flex";
            
            chargerClassement();

            setTimeout(() => {
                if (score > 0) {
                    let playerName = prompt("FIN DE PARTIE ! 🎉\nEntrez votre pseudo (maximum 10 caractères) :", "JOUEUR");
                    if (playerName && playerName.trim() !== "") {
                        playerName = playerName.trim().substring(0, 10);
                        envoyerScore(playerName, score);
                    }
                }
            }, 300);
        }

        function updateHighScoreDisplay() {
            let highest = top10.length > 0 ? top10[0].score : 0;
            document.getElementById("highScoreDisplay").innerHTML = "Top 1: " + highest;
        }

        function renderLeaderboard() {
            const listElement = document.getElementById("leaderboardList");
            listElement.innerHTML = ""; 

            if (top10.length === 0) {
                listElement.innerHTML = "<li style='text-align:center; color:#888;'>Aucun score enregistré</li>";
                return;
            }

            top10.forEach((entry, index) => {
                const li = document.createElement("li");
                li.className = "leaderboard-entry";
                li.innerHTML = `
                    <span class="rank">#${index + 1}</span>
                    <span class="name">${entry.name}</span>
                    <span class="score">${entry.score}</span>
                `;
                listElement.appendChild(li);
            });
        }

        function resetGame() {
            clearTimeout(gameLoopTimeout);
            initGame();
        }

        // --- CONTRÔLES ---
        document.addEventListener("keydown", function(event) {
            if (!gameStarted && event.key === "Enter") { startGame(); return; }
            if (event.key === "Enter" && isGameOverState) { resetGame(); return; }
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(event.key) > -1) event.preventDefault();
            handleDirection(event.keyCode);
        });

        let touchStartX = 0, touchStartY = 0;
        
        document.addEventListener('touchstart', function(event) {
            if (!gameStarted || isGameOverState) return;
            
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchmove', function(event) {
            if(gameStarted && !isGameOverState) event.preventDefault();
        }, {passive: false});

        document.addEventListener('touchend', function(event) {
            if (!gameStarted || isGameOverState) return;
            handleSwipe(touchStartX, touchStartY, event.changedTouches[0].screenX, event.changedTouches[0].screenY);
        }, {passive: false});

        function handleSwipe(startX, startY, endX, endY) {
            let diffX = endX - startX, diffY = endY - startY;
            if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) handleDirection(39); else handleDirection(37);
            } else {
                if (diffY > 0) handleDirection(40); else handleDirection(38);
            }
        }

        function handleDirection(keyCode) {
            const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
            const goingUp = dy === -gridSize, goingDown = dy === gridSize, goingRight = dx === gridSize, goingLeft = dx === -gridSize;
            if (keyCode === LEFT_KEY && !goingRight) { dx = -gridSize; dy = 0; }
            if (keyCode === UP_KEY && !goingDown) { dx = 0; dy = -gridSize; }
            if (keyCode === RIGHT_KEY && !goingLeft) { dx = gridSize; dy = 0; }
            if (keyCode === DOWN_KEY && !goingUp) { dx = 0; dy = gridSize; }
        }
        
        clearCanvas();
        drawGrid();

    </script>
</body>
</html>
